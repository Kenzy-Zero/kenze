[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenze"
version = "0.9.4"
description = "Big-file data prep that never runs out of memory - an interactive shell + one-line CLI, powered by DuckDB."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kenzy Zero", email = "kenzy.zero.k0@gmail.com" }]
keywords = ["duckdb", "data", "csv", "parquet", "etl", "cli", "big-data", "dataframe", "data-cleaning", "data-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Database",
  "Topic :: Utilities",
]
# All three are core:
#  - duckdb: the engine.
#  - psutil: the never-OOM memory sizing (the headline feature).
#  - prompt_toolkit: the interactive shell (`kenze` with no args) - the way most
#    people will use kenze, so it ships by default, not behind an extra.
dependencies = ["duckdb>=1.2", "psutil>=5.9", "prompt_toolkit>=3.0"]

[project.optional-dependencies]
# hand cleaned data straight to a fast in-memory dataframe (kenze.to_polars / to_arrow / to_df)
polars = ["polars>=0.20"]
arrow = ["pyarrow>=14"]
pandas = ["pandas>=1.5"]
# turn a data file into a styled HTML/PDF report (kenze report). HTML needs only
# Jinja2; PDF renders that HTML with the system Chrome/Edge (no extra install).
report = ["jinja2>=3.0"]
# everything optional: the dataframe bridges + report
all = ["polars>=0.20", "pyarrow>=14", "pandas>=1.5", "jinja2>=3.0"]
# contributor toolchain: `pip install -e ".[dev]"` then `pytest`
dev = ["pytest>=7", "ruff==0.15.*", "build", "jinja2>=3.0"]

[project.urls]
Homepage = "https://github.com/Kenzy-Zero/kenze"
Repository = "https://github.com/Kenzy-Zero/kenze"
Documentation = "https://github.com/Kenzy-Zero/kenze/blob/main/DOCS.md"
Changelog = "https://github.com/Kenzy-Zero/kenze/blob/main/CHANGELOG.md"
Issues = "https://github.com/Kenzy-Zero/kenze/issues"

[project.scripts]
kenze = "kenze.cli:main"

[tool.ruff]
# Stated explicitly so every machine lints identically. Without this, ruff uses
# whatever its current default rule set happens to be, and a new ruff release
# turns CI red on untouched code (which is exactly what 0.16.0 did on 2026-07-25).
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# The rules kenze has always effectively been linted against: pyflakes plus the
# pycodestyle errors that catch real mistakes. Additional rule families can be
# adopted deliberately, one at a time, with the fixes in the same commit.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kenze = ["themes/*.html.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
