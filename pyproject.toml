[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenze"
version = "0.5.0"
description = "Big-file data prep that never runs out of memory - no SQL required. Powered by DuckDB."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ken", email = "0kenmusic0@gmail.com" }]
keywords = ["duckdb", "data", "csv", "parquet", "etl", "cli", "big-data", "dataframe", "data-cleaning", "data-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Database",
  "Topic :: Utilities",
]
# psutil is core: the never-OOM memory sizing is the headline feature, so it
# ships by default rather than hiding behind an optional extra.
dependencies = ["duckdb>=0.10", "psutil>=5.9"]

[project.optional-dependencies]
# hand cleaned data straight to a fast in-memory dataframe (kenze.to_polars / to_arrow / to_df)
polars = ["polars>=0.20"]
arrow = ["pyarrow>=14"]
pandas = ["pandas>=1.5"]
all = ["polars>=0.20", "pyarrow>=14", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/Kenzy-Zero/kenze"
Repository = "https://github.com/Kenzy-Zero/kenze"
Documentation = "https://github.com/Kenzy-Zero/kenze/blob/main/DOCS.md"
Changelog = "https://github.com/Kenzy-Zero/kenze/blob/main/CHANGELOG.md"
Issues = "https://github.com/Kenzy-Zero/kenze/issues"

[project.scripts]
kenze = "kenze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
