name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff build

      - name: Lint
        run: python -m ruff check src/kenze

      - name: Smoke test
        run: |
          python -m kenze --version
          python -c "import csv; w=csv.writer(open('t.csv','w',newline='')); w.writerow(['id','city','amount']); [w.writerow([i,'X',i*2]) for i in range(100)]"
          python -m kenze profile t.csv
          python -m kenze filter t.csv --where "amount > 100" -o out.csv -q
          python -m kenze stats t.csv

      - name: Build
        run: python -m build
